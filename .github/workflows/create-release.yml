# Create Release (spec §13.4): run from the Actions tab on main.
# 1. Check: the version must be higher than the last release and have CHANGELOG notes.
# 2. Build, one job per OS (a matrix, like the PR Gate's end-to-end tests): test, build the
#    installer, check it with the end-to-end tests, keep it as an artifact.
# 3. Publish, once every build has passed: tag vX.Y.Z and publish one GitHub release with every
#    installer, the update files the in-app updater reads (the macOS zip with latest-mac.yml, and
#    the Windows installer with latest.yml) and the CHANGELOG notes, so a release is never
#    half-published. The Windows installer is signed through SignPath; with no SignPath secrets a
#    dry run builds it unsigned, and a real release refuses to go on.
# A dry run (any branch) does everything but publish, and keeps the installers for a week.
name: Create Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and check only; publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: create-release
  cancel-in-progress: false

env:
  # Anything but a manual run with "dry run" unchecked publishes nothing.
  DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Releases come from main
        if: env.DRY_RUN != 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Create Release on main (pick main under 'Use workflow from'). A dry run may use any branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, to compare versions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: The version is new and has release notes
        # A dry run reports a failed check but goes on, to test the builds.
        continue-on-error: ${{ env.DRY_RUN == 'true' }}
        run: node scripts/release.mts check

  build:
    name: Build (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          # Each OS builds its own installer and the files the in-app updater reads.
          - os: macos-latest
            installer: |
              dist/*.dmg
              dist/*.zip
              dist/*.zip.blockmap
              dist/latest-mac.yml
          # No blockmap: the installer is signed after it is built (electron-builder.yml).
          - os: windows-latest
            installer: |
              dist/*.exe
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    # The signing certificate, Apple's notarization key and the SignPath values are secrets of this
    # environment.
    environment: Package
    permissions:
      actions: read # the SignPath action reads the job
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm test
      # macOS: sign with the Developer ID and notarize, dry run or not, so a signing or notarization
      # problem (the bundled Music helper, say) shows up before a real release.
      # The certificate goes into a keychain made here: given CSC_LINK, electron-builder 26.15 makes
      # its own with a random password, then unlocks it with the .p12's password (set-key-partition-list)
      # and fails. electron-builder wants the App Store Connect key as a file.
      - name: Import the signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.CSC_LINK }}
          CERTIFICATE_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
      - name: Build, sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENTS" > "$APPLE_API_KEY"
          unset APPLE_API_KEY_CONTENTS
          npm run dist -- -c.mac.identity="Evan Kaiser (AQM822PPT3)" \
            -c.mac.hardenedRuntime=true -c.mac.notarize=true
          rm -f "$APPLE_API_KEY"
      # Windows. Smart App Control judges every executable, so the app inside the installer is signed
      # too: build the unpacked app, have SignPath sign it, pack the installer from the signed app,
      # have SignPath sign the installer, then write its new checksum into latest.yml. Every SignPath
      # value is a secret; dry runs use the test signing policy.
      - name: Is signing set up? (Windows)
        id: signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: A release is signed (Windows)
        if: runner.os == 'Windows' && env.DRY_RUN != 'true' && steps.signing.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "::error::A Windows release is signed. Add the SIGNPATH_* secrets to the Package environment (CONTRIBUTING.md, Signing the Windows installer)."
          exit 1
      - name: Build (Windows, unsigned)
        if: runner.os == 'Windows' && steps.signing.outputs.enabled != 'true'
        run: npm run dist
      - name: Build the app to sign (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --dir --publish never
      - name: Keep the app for SignPath (Windows)
        id: upload-app
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app
          path: dist/win-unpacked
          retention-days: 1
          if-no-files-found: error
      - name: Sign the app (Windows, SignPath)
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.DRY_RUN == 'true' && secrets.SIGNPATH_TEST_SIGNING_POLICY_SLUG || secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800 # a release policy may wait for approval
          output-artifact-directory: signed-app
      - name: Pack the installer from the signed app (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          cp -R signed-app/. dist/win-unpacked/
          npx electron-builder --win --prepackaged dist/win-unpacked --publish never
      - name: Keep the installer for SignPath (Windows)
        id: upload-installer
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: dist/Folk-Dance-Player-Setup-*.exe
          retention-days: 1
          if-no-files-found: error
      - name: Sign the installer (Windows, SignPath)
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.DRY_RUN == 'true' && secrets.SIGNPATH_TEST_SIGNING_POLICY_SLUG || secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-installer
      # Signing changed the installer's bytes, so latest.yml's checksum is written again.
      - name: Use the signed installer (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          cp signed-installer/Folk-Dance-Player-Setup-*.exe dist/
          node scripts/release.mts refresh-feed dist
      # The in-app updater reads latest-mac.yml and latest.yml: a release whose feed is wrong would
      # strand every installed copy. Checked on every run, dry runs included.
      - name: The update feeds match the release
        run: node scripts/release.mts check-feed dist
      - run: npm run test:e2e:dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.installer }}
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Release notes
        continue-on-error: ${{ env.DRY_RUN == 'true' }}
        run: node scripts/release.mts check release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - name: Publish the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" installers/* --target "$GITHUB_SHA" \
            --title "Folk Dance Player $VERSION" --notes-file release-notes.md
