# PR Gate (spec §13.4): every pull request, and every push to main, must typecheck, pass the
# formatting check and the tests, build, and pass the end-to-end tests. Pull requests that change
# the app must also add a CHANGELOG line. Branch protection requires these checks before merging.
name: PR Gate

on:
  pull_request:
    # Not ready_for_review: marking a draft ready changes no code, and the second run it started on
    # the release PR was cancelled by the first's group, leaving the PR blocked. A pull request opened
    # by a workflow (Prepare Release) gets its run once someone clicks "Approve workflows to run".
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # A manual run, e.g. to re-check main. (Its checks don't count toward a pull request's required
  # checks: only pull_request runs do.)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

  # The unit tests on Windows catch what Linux cannot: path separators, line endings and the scripts.
  # Not a required check until the maintainer adds it to the main ruleset (CONTRIBUTING).
  windows-check:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

  # The Microsoft Store package (Windows Store design) builds on every pull request, so a change that
  # breaks it is seen early. It uses the repository variables STORE_IDENTITY_NAME, STORE_PUBLISHER and
  # STORE_PUBLISHER_DISPLAY_NAME (Partner Center → the app → Product identity) when they are set, and
  # a placeholder identity when not. The package is kept for the maintainer to upload.
  windows-store:
    name: Store package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - name: Build the Store package
        shell: bash
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          if [ -n "$STORE_IDENTITY_NAME" ] && [ -n "$STORE_PUBLISHER" ] && [ -n "$STORE_PUBLISHER_DISPLAY_NAME" ]; then
            node scripts/store.mts
          else
            echo "::notice::The STORE_* variables are not set: building with a placeholder identity (a package that cannot be submitted)."
            node scripts/store.mts --test
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-package
          path: dist/*.appx
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: End-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is required; windows-latest runs too but is not a required check until it is added to
        # the main ruleset. ubuntu-latest (under a virtual display) can join later.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.1.0
      - run: npm ci
      # The Swift helper must build on macOS (sync spec §8); the release's npm run dist builds it too.
      - run: npm run build:helper
        if: runner.os == 'macOS'
      - run: npm run test:e2e
      # The tours as Windows runs them (no Apple Music steps), from the Mac runner; the Windows runner
      # walks them as itself in the full run above.
      - name: The tours as on Windows
        if: runner.os == 'macOS'
        run: npm run test:e2e:tour
        env:
          FDP_PLATFORM: windows
      - name: Keep Playwright's report of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  changelog:
    name: CHANGELOG
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR's merge commit and its first parent, today's main
      - name: A change to the app adds a CHANGELOG line
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ] || echo "$LABELS" | grep -q '"no changelog"'; then
            echo "No CHANGELOG line needed (Dependabot, or labeled 'no changelog')."
            exit 0
          fi
          # The merge commit against today's main: exactly this PR's changes. (The event's base SHA
          # goes stale when main moves, and would count other PRs' files.)
          changed=$(git diff --name-only HEAD^1 HEAD)
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::This PR changes the app (src/) but not CHANGELOG.md. Add a line under Unreleased, written for organizers, or label the PR 'no changelog' if nobody would notice the change."
            exit 1
          fi
          echo "OK"
