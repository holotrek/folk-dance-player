# Prepare Release (spec §13.4): run from the Actions tab on main. It bumps the version, moves the
# CHANGELOG's Unreleased notes under it, and opens a draft pull request "Release vX.Y.Z" whose
# description carries the pre-release hardware checklist (docs/manual-testing). Tick it while
# testing, read the notes, and click "Ready for review": that starts the PR Gate. Merge it, then
# run Create Release.
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'major, minor, patch, or an exact version such as 1.0.0 (the first release: 0.1.0)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Releases are prepared from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Prepare Release on main (pick main under 'Use workflow from')."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/release.mts prepare "$BUMP"
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "chore(release): v$VERSION"
          git push origin "$branch"
          # A draft: a pull request opened with this workflow's token starts no workflows, and the
          # PR Gate runs when a person marks it ready (ready_for_review).
          # The description carries the hardware checklist (without its title), so its boxes can be
          # ticked: GitHub makes checkboxes clickable in pull requests, not in files.
          {
            echo "Bumps the version to $VERSION and dates its CHANGELOG notes."
            echo
            echo "1. Install this version's \`.dmg\` (a **Create Release** dry run on this branch builds one) and tick the checklist below as you go."
            echo "2. Check the version and notes, then click **Ready for review**: that starts the PR Gate."
            echo "3. When this is merged, run **Create Release** on main."
            echo
            echo "## Pre-release hardware check"
            tail -n +2 docs/manual-testing/pre-release-hardware.md
          } > "$RUNNER_TEMP/body.md"
          gh pr create --draft --base main --head "$branch" --title "Release v$VERSION" \
            --body-file "$RUNNER_TEMP/body.md"
