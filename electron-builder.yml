# Packaging (spec §9): a Universal macOS .dmg. Build with `npm run dist`; the result is in dist/.
appId: com.folkdanceplayer.app
productName: Folk Dance Player
copyright: Copyright © 2026 Evan Kaiser
directories:
  buildResources: build
  output: dist
# electron-vite's output; production dependencies are added by electron-builder.
files:
  - out/**
  - package.json
mac:
  target:
    - target: dmg
      arch: universal
    # The zip is what the in-app updater downloads (macOS updates cannot use the dmg).
    - target: zip
      arch: universal
  category: public.app-category.music
  # No spaces: GitHub renames an uploaded "Folk Dance Player-…" to "Folk.Dance.Player-…", but
  # latest-mac.yml names the file with hyphens, so the updater would 404 on a name with spaces.
  artifactName: Folk-Dance-Player-${version}-${arch}.${ext}
  icon: build/icon.icns
  # Ad-hoc signed until there's a Developer ID: Apple silicon needs a signature, and a consistent
  # one lets macOS offer "Open Anyway" for a downloaded copy. See CONTRIBUTING.md to sign and
  # notarize.
  identity: '-'
  hardenedRuntime: false
  # The Music library helper (Apple Music sync spec §3.1). It is already Universal, so the Universal
  # merge must take it from the x64 copy as is (x64ArchFiles), or @electron/universal stops on a
  # Mach-O file that is the same in both builds.
  extraResources:
    - from: resources/bin/fdp-music-library
      to: fdp-music-library
    # The guided tour's practice tunes (tour spec §5.1).
    - from: resources/tour/hava-nagila.wav
      to: hava-nagila.wav
    - from: resources/tour/korobushka.wav
      to: korobushka.wav
  x64ArchFiles: Contents/Resources/fdp-music-library
  # Without this key macOS refuses Music access without asking (sync spec §9).
  extendInfo:
    NSAppleMusicUsageDescription: Folk Dance Player reads your Music library to keep its songs and playlists in step with Apple Music.
dmg:
  title: Folk Dance Player
# Written into the app as app-update.yml: where the in-app updater looks for new releases.
publish:
  provider: github
  owner: holotrek
  repo: folk-dance-player
